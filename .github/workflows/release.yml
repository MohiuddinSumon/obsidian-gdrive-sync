name: Release

# Two ways to trigger a release, both "when you want" rather than on every push:
#
# 1. Actions tab -> "Release" -> "Run workflow", optionally typing a version.
#    This bumps manifest.json/package.json, builds, commits, tags, and
#    publishes the GitHub release in one go. Leaving the version blank is
#    safe to re-run any time — if manifest.json's current version was
#    already tagged by an earlier run, the patch number is auto-bumped to
#    the next free one instead of failing.
# 2. Push a version tag yourself (e.g. `git tag 0.1.3 && git push origin 0.1.3`)
#    after already bumping manifest.json to that version. The workflow just
#    builds and publishes the release for that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 0.1.3 (no leading "v"). Leave blank to
          release manifest.json's current version as-is.
        required: false
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine target version
        id: version
        run: |
          git fetch --tags --force origin

          EXPLICIT=0
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            EXPLICIT=1
          else
            VERSION=$(node -p "require('./manifest.json').version")
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must be plain semver with no leading 'v' (BRAT matches the tag against manifest.json's version)."
            exit 1
          fi

          # Re-running "Run workflow" with the version input left blank is
          # meant to just work — it shouldn't die because manifest.json's
          # current version was already tagged by a previous run. Auto-bump
          # the patch number to the next free one instead. An *explicit*
          # version input that collides is a real mistake, though, so that
          # still fails loudly rather than silently picking a different one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            if [ "$EXPLICIT" = "1" ]; then
              echo "::error::Tag $VERSION already exists (see https://github.com/${{ github.repository }}/releases/tag/$VERSION). Pick a version that hasn't been released yet, or leave the input blank to auto-bump the patch version."
              exit 1
            fi
            echo "Tag $VERSION already exists — auto-bumping the patch version to find a free one."
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            while git rev-parse -q --verify "refs/tags/$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Using $VERSION instead."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump manifest.json / package.json
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['manifest.json', 'package.json']) {
              const data = JSON.parse(fs.readFileSync(f, 'utf8'));
              data.version = '${{ steps.version.outputs.version }}';
              fs.writeFileSync(f, JSON.stringify(data, null, 2) + '\n');
            }
          "

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify manifest.json matches the release version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) doesn't match release version (${{ steps.version.outputs.version }})."
            exit 1
          fi

      - name: Commit version bump, tag, and push
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json main.js
          if ! git diff --cached --quiet; then
            git commit -m "Release ${{ steps.version.outputs.version }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::Tag ${{ steps.version.outputs.version }} already exists (created by a concurrent run) — skipping tag creation, still publishing the release."
          else
            git tag "${{ steps.version.outputs.version }}"
            git push origin "${{ steps.version.outputs.version }}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            main.js
            manifest.json
            styles.css
